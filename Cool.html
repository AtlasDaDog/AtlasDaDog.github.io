<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="Going%20on.css">
    <meta charset="UTF-8">
    <title>Simon Says</title>
</head>
<body>

<h1>Simon Says!</h1>
<div id="simon-board">
		<button id="topLeft" class="simon-btn top-left"
				onclick="handleClick(this)"
		data-color="1" disabled></button>
		<button id="topRight" class="simon-btn top-right"
				onclick="handleClick(this)"
		data-color="2" disabled></button>
		<button id="btmLeft" class="simon-btn bottom-left"
				onclick="handleClick(this)"
		data-color="3" disabled></button>
		<button id="btmRight" class="simon-btn bottom-right"
				onclick="handleClick(this)"
		data-color="4" disabled></button>
	</div>
<br>
	<div id="level">
		<span>Level:
			<span class="level-count">-</span>
		</span>
	</div>
<button id="start-btn" onclick="gameStart()">Start</button>

<script src="Things.js"></script>
</body>
</html>
